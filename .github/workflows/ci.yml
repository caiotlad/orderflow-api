name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**", "docs/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/orderflow_test
      TEST_DB_USERNAME: orderflow
      TEST_DB_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testar e empacotar
        run: mvn -B -ntp verify
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
      - name: Construir imagem
        run: docker build -t orderflow-api:ci .
